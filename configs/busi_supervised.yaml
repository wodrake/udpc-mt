project_name: busi_supervised
mode: baseline
seed: 42
device: cpu
output_root: outputs/runs

dataset:
  name: busi
  root: data/processed/busi
  image_size: 256
  val_fraction: 0.15
  test_fraction: 0.15
  labeled_fraction: 1.0
  include_normal_as_unlabeled: false
  num_workers: 0
  sample_limit: null
  task_type: binary
  augmentation_profile: ultrasound
  preprocessing:
    normalization: minmax

train:
  epochs: 20
  batch_size: 8
  labeled_batch_size: 8
  max_steps_per_epoch: null
  lr: 0.001
  weight_decay: 0.0001
  log_interval: 10
  save_best_metric: dice

model:
  in_channels: 1
  num_classes: 1
  base_channels: 32
  dropout: 0.2

loss:
  bce_weight: 0.5
  dice_weight: 0.5
