project_name: bml_udpc_mt_server
mode: udpc_mt
seed: 42
device: cuda:0
output_root: outputs/runs

dataset:
  name: bml
  root: /abs/path/to/bml
  image_size: 256
  val_fraction: 0.15
  test_fraction: 0.15
  labeled_fraction: 0.2
  num_workers: 4
  sample_limit: null
  split_source: auto
  task_type: binary
  num_classes: 2
  input_channels: 1
  dimension_mode: 2d
  slice_mode: single_slice
  class_names: [background, lesion]
  augmentation_profile: mri
  preprocessing:
    normalization: minmax

train:
  epochs: 30
  batch_size: 4
  labeled_batch_size: 2
  max_steps_per_epoch: null
  lr: 0.001
  weight_decay: 0.0001
  ema_decay: 0.99
  rampup_epochs: 8
  log_interval: 10
  save_best_metric: dice

model:
  in_channels: 1
  num_classes: 1
  base_channels: 32
  prototype_dim: 64
  dropout: 0.2

loss:
  bce_weight: 0.5
  dice_weight: 0.5
  consistency_weight: 1.0
  prototype_weight: 0.15

uncertainty:
  enabled: true
  mc_passes: 4
  threshold: 0.35

prototype:
  enabled: true
  num_classes: 2
  feature_source: decoder_head
  init_strategy: first_valid_batch
  normalize: true
  temperature: 0.1
  momentum: 0.95
  min_pixels: 32

evaluation:
  metrics: [dice, iou, precision, recall, specificity]
