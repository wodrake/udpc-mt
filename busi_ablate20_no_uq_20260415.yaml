project_name: busi_ablate20_no_uq_20260415
mode: udpc_mt
seed: 42
device: cuda:0
output_root: outputs/runs

dataset:
  name: busi
  root: data/processed/busi
  image_size: 256
  val_fraction: 0.0
  test_fraction: 0.0
  labeled_fraction: 0.2
  include_normal_as_unlabeled: false
  num_workers: 0
  sample_limit: null
  split_source: official
  split_files:
    labeled: data/processed/busi/splits_udpc_mt_ratio20/labeled.txt
    unlabeled: data/processed/busi/splits_udpc_mt_ratio20/unlabeled.txt
    val: data/processed/busi/splits_udpc_mt_ratio20/val.txt
    test: data/processed/busi/splits_udpc_mt_ratio20/test.txt
  task_type: binary
  augmentation_profile: ultrasound
  preprocessing:
    normalization: minmax

train:
  epochs: 220
  batch_size: 8
  labeled_batch_size: 4
  max_steps_per_epoch: null
  lr: 0.001
  weight_decay: 0.0001
  ema_decay: 0.995
  rampup_epochs: 20
  log_interval: 10
  save_best_metric: dice

model:
  in_channels: 1
  num_classes: 1
  base_channels: 32
  prototype_dim: 64
  dropout: 0.2

loss:
  bce_weight: 0.5
  dice_weight: 0.5
  consistency_weight: 1.0
  prototype_weight: 0.08

uncertainty:
  enabled: false
  mc_passes: 8
  threshold: 0.15

prototype:
  enabled: true
  num_classes: 2
  feature_source: decoder_head
  init_strategy: first_valid_batch
  normalize: true
  temperature: 0.1
  momentum: 0.95
  min_pixels: 16

evaluation:
  metrics:
  - dice
  - iou
  - precision
  - recall
  - specificity

wandb:
  enabled: true
  project: udpc-mt
  run_name: busi_ablate20_no_uq_20260415
