project_name: busi_ablate20_supervised_only_20260415
mode: baseline
seed: 42
device: cuda:3
output_root: outputs/runs

dataset:
  name: busi
  root: data/processed/busi
  image_size: 256
  val_fraction: 0.0
  test_fraction: 0.0
  labeled_fraction: 0.2
  include_normal_as_unlabeled: false
  num_workers: 0
  sample_limit: null
  split_source: official
  split_files:
    labeled: data/processed/busi/splits_udpc_mt_ratio20/labeled.txt
    unlabeled: data/processed/busi/splits_udpc_mt_ratio20/unlabeled.txt
    val: data/processed/busi/splits_udpc_mt_ratio20/val.txt
    test: data/processed/busi/splits_udpc_mt_ratio20/test.txt
  task_type: binary
  augmentation_profile: ultrasound
  preprocessing:
    normalization: minmax

train:
  epochs: 220
  batch_size: 8
  labeled_batch_size: 8
  max_steps_per_epoch: null
  lr: 0.001
  weight_decay: 0.0001
  log_interval: 10
  save_best_metric: dice

model:
  in_channels: 1
  num_classes: 1
  base_channels: 32
  dropout: 0.2

loss:
  bce_weight: 0.5
  dice_weight: 0.5

evaluation:
  metrics:
  - dice
  - iou
  - precision
  - recall
  - specificity

wandb:
  enabled: true
  project: udpc-mt
  run_name: busi_ablate20_supervised_only_20260415
