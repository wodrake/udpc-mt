project_name: laa2_baseline_ratio100_0413
mode: baseline
seed: 42
device: cuda:2
output_root: outputs/runs

dataset:
  name: busi
  root: /data1/houshengdi/udpc-mt/data/processed/us_busi_like/laa2
  image_size: 256
  val_fraction: 0.0
  test_fraction: 0.0
  labeled_fraction: 1.0
  include_normal_as_unlabeled: false
  num_workers: 4
  sample_limit: null
  split_source: official
  split_files:
    labeled: /data1/houshengdi/udpc-mt/data/processed/us_busi_like/laa2/splits/train.txt
    val: /data1/houshengdi/udpc-mt/data/processed/us_busi_like/laa2/splits/val.txt
    test: /data1/houshengdi/udpc-mt/data/processed/us_busi_like/laa2/splits/test.txt
  task_type: binary
  num_classes: 2
  input_channels: 1
  dimension_mode: 2d
  slice_mode: single_slice
  class_names:
  - background
  - lesion
  augmentation_profile: ultrasound
  preprocessing:
    normalization: minmax

train:
  epochs: 200
  batch_size: 4
  labeled_batch_size: 4
  max_steps_per_epoch: null
  lr: 0.001
  weight_decay: 0.0001
  log_interval: 10
  save_best_metric: dice

model:
  in_channels: 1
  num_classes: 1
  base_channels: 32
  dropout: 0.2

loss:
  bce_weight: 0.5
  dice_weight: 0.5

evaluation:
  metrics:
  - dice
  - iou
  - precision
  - recall
  - specificity

wandb:
  enabled: true
  project: udpc-mt
  run_name: laa2_baseline_ratio100_0413
